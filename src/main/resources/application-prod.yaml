spring:
  datasource:
    url: ${DB_URL}
    username: ${db_username}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${gmail_host}
    port: ${gmail_port}
    username: ${gmail_username}
    password: ${gmail_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
application:
  security:
    oauth2:
      google:
        # The ID-token verifier reads this value. Configure it in Render rather
        # than committing a credential to source control.
        client-id: ${GOOGLE_CLIENT_ID}
    jwt:
      secret-key: ${secret_key}
      expiration: 86400000 # a day
      refresh-token:
        expiration: 604800000 # 7 days
  mailing:
    frontend:
      activation-url: ${activation_url}
  file:
    uploads:
      photos-output-path: ./uploads

server:
  port: 8088

logging:
  level:
    root: INFO
    com.pratima: DEBUG


